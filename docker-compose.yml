# Local development only. Production uses a managed PostgreSQL (ADR-0014, DEC-12).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avelys}
      # Local throwaway credential; never reused outside this container.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avelys_local}
      POSTGRES_DB: ${POSTGRES_DB:-avelys}
    ports:
      # 5433: a native PostgreSQL service may already own 5432 on the host.
      - "127.0.0.1:5433:5432"
    volumes:
      - avelys-db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  avelys-db:
