name: Claude review

# Independent review of every ready pull request (Master Spec §25.3), run with the owner's
# Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`), not paid API credits.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # No drafts, no Dependabot, no forks (secrets are never exposed to fork PRs).
    if: >-
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check that the Claude token is configured
        id: auth
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the Claude review."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.configured == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        if: steps.auth.outputs.configured == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the Reviewer of the Avelys project. Follow the instructions in
            .claude/agents/reviewer.md (ignore its YAML frontmatter), with CLAUDE.md and the
            docs the linked ticket cites. The PR branch is checked out in the working directory.

            Post exactly one top-level comment with `gh pr comment`, in French, in the verdict
            format of reviewer.md. Use `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) only for concrete defects at a specific line.
            Never approve, merge, push or edit files. Never print secrets or personal data.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*)"
